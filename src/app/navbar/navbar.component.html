<nav class="navbar">
  <div class="navbar-left">
  <a routerLink="/" class="brand">
    <!-- <img src="https://i.ibb.co/dwHf1XM2/logo-blanco-peque-o.png" alt="Logo" class="navbar-logo" /> -->
     <img src="https://i.ibb.co/FLnV05vQ/colores-sf.png" alt="Logo" class="navbar-logo" />
  </a>
</div>

  <div class="navbar-center">
    <a routerLink="/servicios">Servicios</a>
    <a routerLink="/agenda">Agenda</a>
    <a routerLink="/contacto">Contacto</a>
    @if (userId) {
      <a [routerLink]="['/galeria', userId]">Galería</a>
    }

  </div>

  <div class="navbar-right">
    @if (!isLoggedIn) {
      <button class="btn btn-primary me-2 " (click)="loginModal.openModal()">Login</button>
      <button class="btn btn-success" (click)="registerModal.openModal()">Registro</button>
    } @else {
      @if (userPhotoURL) {
        <img [src]="userPhotoURL" alt="Foto perfil" class="profile-pic"/>
      } @else {
        <img src="https://i.ibb.co/xKFFqvhd/foto-Perfil.png" class="profile-pic">
      }
      <span class="user-email">{{ loggedIn }}</span>
      <button class="btn btn-danger btn-sm ms-2" (click)="logout()">Salir</button>

      <app-expired-reservations-notification [userId]="userId" style="margin-left: 10%;"></app-expired-reservations-notification>
    }
  </div>

  <!-- 🔹 Modales -->
  <app-login-modal #loginModal></app-login-modal>
  <app-register-modal #registerModal></app-register-modal>
</nav>
