<div class="upload-container">
  <h2>Subir Fotos para un Cliente</h2>
  <form (ngSubmit)="onUpload()">
    <div class="form-group">
      <label for="userId">ID del Cliente:</label>
      <input type="text" id="userId" [(ngModel)]="userId" name="userId" required>
    </div>
    <div class="form-group">
      <label for="fileInput">Seleccionar Foto:</label>
      <input type="file" id="fileInput" (change)="onFileSelected($event)" required>
    </div>
    <button type="submit" [disabled]="isUploading">
      {{ isUploading ? 'Subiendo...' : 'Subir Foto' }}
    </button>
  </form>
  <div *ngIf="uploadStatus" class="status-message">
    {{ uploadStatus }}
  </div>
</div>
