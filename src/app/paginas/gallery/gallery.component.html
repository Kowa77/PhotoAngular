<div class="gallery-container">
    <h2>Mi Galería de Fotos</h2>
    <div *ngIf="isLoading" class="loading-message">Cargando fotos...</div>
    <div *ngIf="!isLoading && photos.length === 0" class="no-photos-message">
        No se encontraron fotos en tu álbum.
    </div>
    <div *ngIf="!isLoading && photos.length > 0" class="photo-grid">
        <div *ngFor="let photo of photos" class="photo-item">
            <img [src]="photo.baseUrl" alt="Foto de la galería">
        </div>
    </div>
</div>
