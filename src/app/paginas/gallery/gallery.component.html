<div class="gallery-container">
  <h2>Mi Galería de Fotos</h2>

  @if (isLoading) {
    <div class="loading-message">Cargando fotos...</div>
  } @else if (photos.length === 0) {
    <div class="no-photos-message">
      No se encontraron fotos en tu álbum.
    </div>
  } @else {
    <div class="photo-grid">
      @for (photo of photos; track photo.id) {
        <div class="photo-item" (click)="openImage(photo.baseUrl)">
          <img [src]="photo.baseUrl" alt="Foto de la galería" class="gallery-image">
        </div>
      }
    </div>
  }
</div>

@if (selectedImage) {
  <div class="lightbox-overlay" (click)="closeImage()">
    <div class="lightbox-content" (click)="$event.stopPropagation()">
      <img [src]="selectedImage" alt="Imagen en tamaño completo" class="lightbox-image">
      <div class="lightbox-buttons">
        <button class="close-button" (click)="closeImage()">Cerrar</button>
        <button class="download-button" (click)="downloadImage(selectedImage)">Descargar</button>
      </div>
    </div>
  </div>
}
